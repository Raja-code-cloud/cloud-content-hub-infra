name: Setup Terraform
description: Install Terraform with provider plugin caching for faster workflow runs.

inputs:
  terraform-version:
    description: Terraform version to install.
    required: false
    default: "1.13.0"
  working-directory:
    description: Optional working directory for environment-scoped provider cache.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Configure Terraform plugin cache
      shell: bash
      run: |
        mkdir -p "$HOME/.terraform.d/plugin-cache"
        echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
        echo "TF_IN_AUTOMATION=true" >> "$GITHUB_ENV"

    - name: Cache Terraform plugin directory
      uses: actions/cache@v4
      with:
        path: ~/.terraform.d/plugin-cache
        key: terraform-plugins-${{ inputs.terraform-version }}-${{ hashFiles('**/versions.tf', '**/.terraform.lock.hcl') }}
        restore-keys: |
          terraform-plugins-${{ inputs.terraform-version }}-

    - name: Cache environment providers
      if: inputs.working-directory != '.'
      uses: actions/cache@v4
      with:
        path: ${{ inputs.working-directory }}/.terraform
        key: terraform-env-${{ inputs.working-directory }}-${{ hashFiles(format('{0}/versions.tf', inputs.working-directory), format('{0}/.terraform.lock.hcl', inputs.working-directory)) }}
        restore-keys: |
          terraform-env-${{ inputs.working-directory }}-

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false
