name: Terraform Lint

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".tflint.hcl"
      - ".github/workflows/terraform-lint.yml"
      - ".github/actions/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  TFLINT_VERSION: "v0.50.3"

jobs:
  lint:
    name: TFLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup TFLint
        uses: ./.github/actions/setup-tflint
        with:
          tflint-version: ${{ env.TFLINT_VERSION }}

      - name: Run TFLint
        run: |
          tflint --init
          tflint \
            --disable-rule=terraform_required_version \
            --disable-rule=terraform_required_providers \
            --recursive \
            --format compact

      - name: Upload lint log
        if: always()
        run: |
          tflint \
            --disable-rule=terraform_required_version \
            --disable-rule=terraform_required_providers \
            --recursive \
            --format json > tflint-report.json || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tflint-report
          path: tflint-report.json
          retention-days: 14
          if-no-files-found: ignore
