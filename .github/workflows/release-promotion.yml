name: Release Promotion

on:
  workflow_dispatch:
    inputs:
      promotion_target:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
      git_ref:
        description: Git ref to promote (branch, tag, or SHA)
        required: true
        type: string
      release_tag:
        description: Release tag (required for prod)
        required: false
        type: string
        default: ""
  push:
    branches:
      - develop
    paths:
      - "environments/**"
      - "modules/**"
      - "release/**"
      - ".github/workflows/release-promotion.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write
  security-events: write
  actions: read

env:
  TF_VERSION: "1.13.0"

jobs:
  resolve-inputs:
    name: Resolve Promotion Inputs
    runs-on: ubuntu-latest
    outputs:
      promotion_target: ${{ steps.resolve.outputs.promotion_target }}
      git_ref: ${{ steps.resolve.outputs.git_ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}

    steps:
      - name: Resolve inputs
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "promotion_target=dev" >> "$GITHUB_OUTPUT"
            echo "git_ref=develop" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          else
            echo "promotion_target=${{ inputs.promotion_target }}" >> "$GITHUB_OUTPUT"
            echo "git_ref=${{ inputs.git_ref }}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

  validate-inputs:
    name: Validate Promotion Path
    runs-on: ubuntu-latest
    needs: resolve-inputs

    steps:
      - name: Enforce linear promotion rules
        run: |
          target="${{ needs.resolve-inputs.outputs.promotion_target }}"
          git_ref="${{ needs.resolve-inputs.outputs.git_ref }}"
          release_tag="${{ needs.resolve-inputs.outputs.release_tag }}"

          echo "Promotion: target=$target git_ref=$git_ref release_tag=$release_tag"

          case "$target" in
            dev)
              echo "Dev promotion allowed."
              ;;
            stage)
              if [[ "$git_ref" != "main" && ! "$git_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
                echo "::warning::Stage promotion typically uses git_ref=main or RC tag."
              fi
              ;;
            prod)
              if [[ -z "$release_tag" ]]; then
                echo "::error::Production promotion requires release_tag."
                exit 1
              fi
              if [[ "$git_ref" != "$release_tag" ]]; then
                echo "::error::Production git_ref must match release_tag."
                exit 1
              fi
              if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-hotfix\.[0-9]+)?$ ]]; then
                echo "::error::Production release_tag must match v*.*.* or v*.*.*-hotfix.*"
                exit 1
              fi
              ;;
          esac

  quality-gates:
    name: Quality Gates
    needs:
      - resolve-inputs
      - validate-inputs
    uses: ./.github/workflows/release-validate.yml
    with:
      git_ref: ${{ needs.resolve-inputs.outputs.git_ref }}
      environment: ${{ needs.resolve-inputs.outputs.promotion_target }}

  plan:
    name: Plan (${{ needs.resolve-inputs.outputs.promotion_target }})
    runs-on: ubuntu-latest
    needs:
      - resolve-inputs
      - validate-inputs
      - quality-gates

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-inputs.outputs.git_ref }}

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: environments/${{ needs.resolve-inputs.outputs.promotion_target }}

      - name: Terraform Init
        working-directory: environments/${{ needs.resolve-inputs.outputs.promotion_target }}
        run: terraform init -backend=false -input=false

      - name: Terraform Plan
        working-directory: environments/${{ needs.resolve-inputs.outputs.promotion_target }}
        run: |
          set -o pipefail
          terraform plan \
            -input=false \
            -no-color \
            -var-file=terraform.tfvars.example \
            -out=tfplan 2>&1 | tee plan.log
          terraform show -no-color tfplan > plan.txt

      - name: Compute plan checksum
        id: checksum
        working-directory: environments/${{ needs.resolve-inputs.outputs.promotion_target }}
        run: echo "sha256=$(sha256sum tfplan | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.resolve-inputs.outputs.promotion_target }}-${{ github.run_id }}
          path: |
            environments/${{ needs.resolve-inputs.outputs.promotion_target }}/tfplan
            environments/${{ needs.resolve-inputs.outputs.promotion_target }}/plan.txt
            environments/${{ needs.resolve-inputs.outputs.promotion_target }}/plan.log
          retention-days: 90

      - name: Plan summary
        run: |
          {
            echo "### Plan — \`${{ needs.resolve-inputs.outputs.promotion_target }}\`"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Git ref | \`${{ needs.resolve-inputs.outputs.git_ref }}\` |"
            echo "| Checksum | \`${{ steps.checksum.outputs.sha256 }}\` |"
            echo ""
            echo "Do not re-plan after approval. Apply this exact artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply (${{ needs.resolve-inputs.outputs.promotion_target }})
    runs-on: ubuntu-latest
    needs:
      - resolve-inputs
      - plan
    environment: ${{ needs.resolve-inputs.outputs.promotion_target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-inputs.outputs.git_ref }}

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: environments/${{ needs.resolve-inputs.outputs.promotion_target }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.resolve-inputs.outputs.promotion_target }}-${{ github.run_id }}
          path: environments/${{ needs.resolve-inputs.outputs.promotion_target }}

      - name: Terraform Init
        working-directory: environments/${{ needs.resolve-inputs.outputs.promotion_target }}
        run: terraform init -backend=false -input=false

      - name: Verify plan artifact exists
        working-directory: environments/${{ needs.resolve-inputs.outputs.promotion_target }}
        run: |
          [[ -f tfplan ]] || { echo "::error::Plan artifact missing. Cannot apply."; exit 1; }
          echo "Applying immutable plan artifact from run ${{ github.run_id }}"

      - name: Terraform Apply (disabled — OIDC pending)
        working-directory: environments/${{ needs.resolve-inputs.outputs.promotion_target }}
        run: |
          echo "::notice::Apply disabled until Azure OIDC is configured."
          echo "Promotion target: ${{ needs.resolve-inputs.outputs.promotion_target }}"
          echo "Git ref: ${{ needs.resolve-inputs.outputs.git_ref }}"
          echo "Command: terraform apply -input=false -auto-approve tfplan"

  audit:
    name: Audit Record
    runs-on: ubuntu-latest
    needs:
      - resolve-inputs
      - plan
      - apply
    if: always() && needs.plan.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-inputs.outputs.git_ref }}

      - name: Generate promotion audit record
        run: |
          mkdir -p audit-records
          cat > "audit-records/promotion-${{ needs.resolve-inputs.outputs.promotion_target }}-${{ github.run_id }}.json" <<EOF
          {
            "record_type": "promotion",
            "promotion_id": "${{ github.run_id }}",
            "promotion_target": "${{ needs.resolve-inputs.outputs.promotion_target }}",
            "git_ref": "${{ needs.resolve-inputs.outputs.git_ref }}",
            "git_commit": "$(git rev-parse HEAD)",
            "release_tag": "${{ needs.resolve-inputs.outputs.release_tag }}",
            "terraform_version": "${{ env.TF_VERSION }}",
            "plan_artifact": "tfplan-${{ needs.resolve-inputs.outputs.promotion_target }}-${{ github.run_id }}",
            "promoted_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "apply_result": "${{ needs.apply.result }}"
          }
          EOF

      - name: Upload audit record
        uses: actions/upload-artifact@v4
        with:
          name: promotion-record-${{ needs.resolve-inputs.outputs.promotion_target }}-${{ github.run_id }}
          path: audit-records/
          retention-days: 90
