name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (production is blocked)
        required: true
        type: choice
        options:
          - dev
          - stage
      confirmation:
        description: 'Type "destroy-<environment>" to confirm (e.g. destroy-dev)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.13.0"

jobs:
  guard:
    name: Destroy Guard
    runs-on: ubuntu-latest
    steps:
      - name: Block production destroy
        run: |
          if [[ "${{ inputs.environment }}" == "prod" ]]; then
            echo "::error::Destroy is permanently disabled for production."
            exit 1
          fi

      - name: Validate confirmation phrase
        run: |
          expected="destroy-${{ inputs.environment }}"
          if [[ "${{ inputs.confirmation }}" != "$expected" ]]; then
            echo "::error::Confirmation mismatch. Type '$expected' to confirm destroy."
            exit 1
          fi

      - name: Destroy guard passed
        run: echo "Destroy guard passed for environment '${{ inputs.environment }}'."

  validate:
    name: Pre-Destroy Validation
    needs: guard
    uses: ./.github/workflows/terraform-validate.yml
    secrets: inherit
    permissions:
      contents: read

  destroy:
    name: Destroy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs:
      - guard
      - validate
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: environments/${{ inputs.environment }}

      - name: Terraform Init
        working-directory: environments/${{ inputs.environment }}
        run: terraform init -backend=false -input=false

      - name: Terraform Destroy (disabled — OIDC pending)
        working-directory: environments/${{ inputs.environment }}
        run: |
          echo "::warning::Destroy execution is disabled until Azure OIDC authentication is configured."
          echo "Environment: ${{ inputs.environment }}"
          echo "After OIDC setup, enable the destroy step below."
          echo ""
          echo "Planned command: terraform destroy -input=false -auto-approve -var-file=terraform.tfvars.example"
          # Uncomment after OIDC and backend configuration:
          # terraform destroy -input=false -auto-approve -var-file=terraform.tfvars.example

      - name: Upload destroy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: destroy-log-${{ inputs.environment }}-${{ github.run_id }}
          path: environments/${{ inputs.environment }}/
          retention-days: 30
          if-no-files-found: ignore
