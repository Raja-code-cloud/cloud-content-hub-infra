name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (production is blocked)
        required: true
        type: choice
        options:
          - dev
          - stage
      confirmation:
        description: 'Type "destroy-<environment>" to confirm (e.g. destroy-dev)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.13.0"

jobs:
  guard:
    name: Destroy Guard
    runs-on: ubuntu-latest
    steps:
      - name: Block production destroy
        run: |
          if [[ "${{ inputs.environment }}" == "prod" ]]; then
            echo "::error::Destroy is permanently disabled for production."
            exit 1
          fi

      - name: Validate confirmation phrase
        run: |
          expected="destroy-${{ inputs.environment }}"
          if [[ "${{ inputs.confirmation }}" != "$expected" ]]; then
            echo "::error::Confirmation mismatch. Type '$expected' to confirm destroy."
            exit 1
          fi

      - name: Destroy guard passed
        run: echo "Destroy guard passed for environment '${{ inputs.environment }}'."

  validate:
    name: Pre-Destroy Validation
    needs: guard
    uses: ./.github/workflows/terraform-validate.yml
    secrets: inherit
    permissions:
      contents: read

  destroy:
    name: Destroy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs:
      - guard
      - validate
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate OIDC and backend secrets
        run: |
          missing=()
          [[ -z "${{ secrets.AZURE_CLIENT_ID }}" ]] && missing+=("AZURE_CLIENT_ID")
          [[ -z "${{ secrets.AZURE_TENANT_ID }}" ]] && missing+=("AZURE_TENANT_ID")
          [[ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]] && missing+=("AZURE_SUBSCRIPTION_ID")
          [[ -z "${{ secrets.TF_STATE_RESOURCE_GROUP }}" ]] && missing+=("TF_STATE_RESOURCE_GROUP")
          [[ -z "${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" ]] && missing+=("TF_STATE_STORAGE_ACCOUNT")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required GitHub Environment secrets: ${missing[*]}"
            exit 1
          fi

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: environments/${{ inputs.environment }}

      - name: Resolve state key
        id: backend
        run: |
          if [[ -n "${{ secrets.TF_STATE_KEY }}" ]]; then
            echo "state_key=${{ secrets.TF_STATE_KEY }}" >> "$GITHUB_OUTPUT"
          else
            echo "state_key=${{ inputs.environment }}.tfstate" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure Terraform Init
        uses: ./.github/actions/azure-terraform
        with:
          working-directory: environments/${{ inputs.environment }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tf-state-resource-group: ${{ secrets.TF_STATE_RESOURCE_GROUP }}
          tf-state-storage-account: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
          tf-state-container: ${{ secrets.TF_STATE_CONTAINER }}
          tf-state-key: ${{ steps.backend.outputs.state_key }}
          use-remote-backend: "true"

      - name: Terraform Destroy
        working-directory: environments/${{ inputs.environment }}
        run: terraform destroy -input=false -auto-approve -var-file=terraform.tfvars.example

      - name: Upload destroy log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: destroy-log-${{ inputs.environment }}-${{ github.run_id }}
          path: environments/${{ inputs.environment }}/
          retention-days: 30
          if-no-files-found: ignore
