name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
      confirmation:
        description: 'Type the environment name to confirm apply (e.g. dev)'
        required: true
        type: string
      use_plan_artifact:
        description: Use plan artifact from a previous workflow run (run ID)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.13.0"

jobs:
  guard:
    name: Confirm Apply
    runs-on: ubuntu-latest
    outputs:
      confirmed: ${{ steps.validate.outputs.confirmed }}
    steps:
      - name: Block direct production apply
        if: inputs.environment == 'prod'
        run: |
          echo "::error::Direct production apply is blocked."
          echo "Production deployments must use release-promotion.yml or release-emergency.yml."
          echo "See: release/docs/promotion-flow.md"
          exit 1

      - name: Validate confirmation input
        id: validate
        run: |
          if [[ "${{ inputs.confirmation }}" != "${{ inputs.environment }}" ]]; then
            echo "::error::Confirmation mismatch. Type '${{ inputs.environment }}' to confirm."
            exit 1
          fi
          echo "confirmed=true" >> "$GITHUB_OUTPUT"

  validate:
    name: Pre-Apply Validation
    needs: guard
    uses: ./.github/workflows/terraform-validate.yml
    secrets: inherit
    permissions:
      contents: read

  apply:
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs:
      - guard
      - validate
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate OIDC and backend secrets
        run: |
          missing=()
          [[ -z "${{ secrets.AZURE_CLIENT_ID }}" ]] && missing+=("AZURE_CLIENT_ID")
          [[ -z "${{ secrets.AZURE_TENANT_ID }}" ]] && missing+=("AZURE_TENANT_ID")
          [[ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]] && missing+=("AZURE_SUBSCRIPTION_ID")
          [[ -z "${{ secrets.TF_STATE_RESOURCE_GROUP }}" ]] && missing+=("TF_STATE_RESOURCE_GROUP")
          [[ -z "${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" ]] && missing+=("TF_STATE_STORAGE_ACCOUNT")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required GitHub Environment secrets: ${missing[*]}"
            echo "Configure OIDC and remote state secrets per docs/cicd/README.md"
            exit 1
          fi

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: environments/${{ inputs.environment }}

      - name: Download plan artifact
        if: inputs.use_plan_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ inputs.environment }}-${{ inputs.use_plan_artifact }}
          path: environments/${{ inputs.environment }}

      - name: Resolve state key
        id: backend
        run: |
          if [[ -n "${{ secrets.TF_STATE_KEY }}" ]]; then
            echo "state_key=${{ secrets.TF_STATE_KEY }}" >> "$GITHUB_OUTPUT"
          else
            echo "state_key=${{ inputs.environment }}.tfstate" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure Terraform Init
        uses: ./.github/actions/azure-terraform
        with:
          working-directory: environments/${{ inputs.environment }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tf-state-resource-group: ${{ secrets.TF_STATE_RESOURCE_GROUP }}
          tf-state-storage-account: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
          tf-state-container: ${{ secrets.TF_STATE_CONTAINER }}
          tf-state-key: ${{ steps.backend.outputs.state_key }}
          use-remote-backend: "true"

      - name: Generate plan when artifact not provided
        if: inputs.use_plan_artifact == ''
        working-directory: environments/${{ inputs.environment }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file=terraform.tfvars.example \
            -out=tfplan

      - name: Terraform Apply
        working-directory: environments/${{ inputs.environment }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Upload apply log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apply-log-${{ inputs.environment }}-${{ github.run_id }}
          path: environments/${{ inputs.environment }}/
          retention-days: 30
          if-no-files-found: ignore
