name: Terraform Pull Request

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "modules/**"
      - "environments/**"
      - "tests/**"
      - "deployment/**"
      - "release/**"
      - "policies/**"
      - ".github/**"
      - ".tflint.hcl"
      - ".checkov.yml"
      - ".terraform-docs.yml"

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write
  id-token: write

jobs:
  format:
    name: Format
    uses: ./.github/workflows/terraform-format.yml
    permissions:
      contents: read

  lint:
    name: Lint
    uses: ./.github/workflows/terraform-lint.yml
    permissions:
      contents: read

  validate:
    name: Validate
    needs:
      - format
    uses: ./.github/workflows/terraform-validate.yml
    permissions:
      contents: read

  docs:
    name: Documentation
    needs:
      - format
    uses: ./.github/workflows/terraform-docs.yml
    permissions:
      contents: read

  security:
    name: Security
    needs:
      - format
    uses: ./.github/workflows/terraform-security.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  test-framework:
    name: Test Framework
    needs:
      - format
    uses: ./.github/workflows/terraform-test-framework.yml
    with:
      suite: regression
      with_plan: false
    permissions:
      contents: read

  plan:
    name: Plan
    needs:
      - validate
      - lint
      - docs
      - security
    uses: ./.github/workflows/terraform-plan.yml
    permissions:
      contents: read
      pull-requests: write
      id-token: write

  pr-gate:
    name: Pull Request Gate
    runs-on: ubuntu-latest
    needs:
      - format
      - lint
      - validate
      - docs
      - security
      - test-framework
      - plan
    if: always()

    steps:
      - name: Evaluate pull request checks
        run: |
          echo "Format:    ${{ needs.format.result }}"
          echo "Lint:      ${{ needs.lint.result }}"
          echo "Validate:  ${{ needs.validate.result }}"
          echo "Docs:      ${{ needs.docs.result }}"
          echo "Security:  ${{ needs.security.result }}"
          echo "Plan:      ${{ needs.plan.result }}"

          {
            echo "# Pull Request Validation Summary"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| Format | ${{ needs.format.result }} |"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Validate | ${{ needs.validate.result }} |"
            echo "| Docs | ${{ needs.docs.result }} |"
          echo "| Security | ${{ needs.security.result }} |"
          echo "| Test Framework | ${{ needs.test-framework.result }} |"
          echo "| Plan | ${{ needs.plan.result }} |"
          } > pr-validation-summary.md

          for result in \
            "${{ needs.format.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.validate.result }}" \
            "${{ needs.docs.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.test-framework.result }}" \
            "${{ needs.plan.result }}"; do
            if [[ "$result" == "failure" ]] || [[ "$result" == "cancelled" ]]; then
              echo "::error::Pull request checks failed."
              exit 1
            fi
          done

          echo "All pull request checks passed."

      - name: Upload PR validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation-summary-${{ github.run_id }}
          path: pr-validation-summary.md
          retention-days: 14
