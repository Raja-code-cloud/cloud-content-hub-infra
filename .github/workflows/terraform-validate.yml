name: Terraform Validate

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "tests/**"
      - ".github/workflows/terraform-validate.yml"
      - ".github/actions/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  TF_VERSION: "1.13.0"

jobs:
  discover:
    name: Discover Targets
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
      environments: ${{ steps.discover.outputs.environments }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Discover modules and environments
        id: discover
        run: |
          chmod +x tests/scripts/discover-modules.sh tests/scripts/discover-environments.sh
          echo "modules=$(./tests/scripts/discover-modules.sh --json | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "environments=$(./tests/scripts/discover-environments.sh --json | jq -c .)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.discover.outputs.environments) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: environments/${{ matrix.environment }}

      - name: Terraform Init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate -no-color

      - name: Upload validation log
        if: always()
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate -no-color > "${{ runner.temp }}/validate-${{ matrix.environment }}.log" 2>&1 || true

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-log-${{ matrix.environment }}
          path: ${{ runner.temp }}/validate-${{ matrix.environment }}.log
          retention-days: 14
          if-no-files-found: ignore

  validate-modules:
    name: Validate Modules (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: modules/${{ matrix.module }}

      - name: Terraform Init
        working-directory: modules/${{ matrix.module }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: modules/${{ matrix.module }}
        run: terraform validate -no-color
