name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
  workflow_call:
    inputs:
      environment:
        description: Target environment (omit to plan all environments)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.13.0"

jobs:
  resolve-environments:
    name: Resolve Environments
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.resolve.outputs.environments }}
    steps:
      - name: Resolve target environments
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'environments=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.environment }}" ]]; then
            echo 'environments=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'environments=["dev","stage","prod"]' >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: resolve-environments
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.resolve-environments.outputs.environments) }}

    environment: ${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: environments/${{ matrix.environment }}

      - name: Terraform Init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: Terraform Plan
        working-directory: environments/${{ matrix.environment }}
        run: |
          set -o pipefail
          terraform plan \
            -input=false \
            -no-color \
            -var-file=terraform.tfvars.example \
            -out=tfplan 2>&1 | tee plan.log
          terraform show -no-color tfplan > plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}-${{ github.run_id }}
          path: |
            environments/${{ matrix.environment }}/tfplan
            environments/${{ matrix.environment }}/plan.txt
            environments/${{ matrix.environment }}/plan.log
          retention-days: 30

      - name: Write plan summary
        run: |
          {
            echo "### Terraform Plan — \`${{ matrix.environment }}\`"
            echo ""
            echo "<details><summary>Plan output (last 100 lines)</summary>"
            echo ""
            echo '```terraform'
            tail -n 100 "environments/${{ matrix.environment }}/plan.log"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = `environments/${{ matrix.environment }}/plan.log`;
            let planOutput = fs.existsSync(planPath)
              ? fs.readFileSync(planPath, 'utf8')
              : 'Plan output unavailable.';
            if (planOutput.length > 60000) {
              planOutput = planOutput.slice(-60000);
            }
            const body = [
              '## Terraform Plan — `${{ matrix.environment }}`',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              planOutput,
              '```',
              '',
              '</details>',
              '',
              `*Workflow: [${context.runId}](${context.payload.repository.html_url}/actions/runs/${context.runId})*`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
