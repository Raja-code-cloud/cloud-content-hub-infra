name: Terraform Security

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".checkov.yml"
      - ".tfsec.yml"
      - ".github/workflows/terraform-security.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checkov:
    name: Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.3114.0
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yml
          soft_fail: false
          output_format: sarif
          output_file_path: checkov.sarif
          hard_fail_on: HIGH,CRITICAL

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: checkov
        continue-on-error: true

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-report
          path: checkov.sarif
          retention-days: 30
          if-no-files-found: ignore

  tfsec:
    name: tfsec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .
          soft_fail: false
          format: sarif
          sarif_file: tfsec.sarif
          minimum_severity: HIGH

      - name: Upload tfsec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tfsec.sarif
          category: tfsec
        continue-on-error: true

      - name: Upload tfsec report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tfsec-report
          path: tfsec.sarif
          retention-days: 30
          if-no-files-found: ignore

  trivy:
    name: Trivy IaC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          format: sarif
          output: trivy.sarif
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy
        continue-on-error: true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy.sarif
          retention-days: 30
          if-no-files-found: ignore

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - checkov
      - tfsec
      - trivy
    if: always()

    steps:
      - name: Evaluate security scan results
        run: |
          echo "Checkov:  ${{ needs.checkov.result }}"
          echo "tfsec:    ${{ needs.tfsec.result }}"
          echo "Trivy:    ${{ needs.trivy.result }}"

          {
            echo "# Security Scan Summary"
            echo ""
            echo "| Scanner | Result |"
            echo "|---------|--------|"
            echo "| Checkov | ${{ needs.checkov.result }} |"
            echo "| tfsec   | ${{ needs.tfsec.result }} |"
            echo "| Trivy   | ${{ needs.trivy.result }} |"
          } > security-summary.md

          if [[ "${{ needs.checkov.result }}" == "failure" ]] || \
             [[ "${{ needs.tfsec.result }}" == "failure" ]] || \
             [[ "${{ needs.trivy.result }}" == "failure" ]]; then
            echo "::error::One or more security scans reported HIGH or CRITICAL findings."
            exit 1
          fi

      - name: Upload security summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-summary
          path: security-summary.md
          retention-days: 30
